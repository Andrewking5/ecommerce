        - listitem [ref=e303]:
          - generic [ref=e305]:
            - heading [level=3] [ref=e308]:
              - generic [ref=e309]:
                - text: 是否了解參賽12點注意事項，參加比賽者同意本規定之效參賽規則
                - text: "1. 演奏組參賽者須將影片上傳至 ①YouTube （必須）及 ②Instagram / Facebook（擇一），並將影片標題命名為「參賽曲名_姓名_演奏組 #2026Ayers靈魂吉他手大賽」。Instagram / Facebook 貼文亦須加上 #2026Ayers靈魂吉他手大賽。"
                - text: "2. 彈唱組參賽者須將影片上傳至 ①YouTube （必須）及 ②Instagram / Facebook（擇一），並將影片標題命名為「參賽曲名_姓名_彈唱組 #2026Ayers靈魂吉他手大賽」。Instagram / Facebook 貼文亦須加上 #2026Ayers靈魂吉他手大賽。"
                - text: 3.影片彈唱前需說明：「大家好我是（本名/藝名/團名），今天來參加2026Ayers靈魂吉他手大賽，報名（演奏組/彈唱組），我的靈魂是（xx）吉他魂（⚠️需與身上顏色相同），（想帶給大家的一句話）。比賽曲目是（創作者）的（歌名）。」
                - text: 4.影片總時長需為30秒至120秒。
                - text: 5.錄製影像需為直式固定鏡頭一鏡到底，禁止合成、剪輯、運鏡、轉場效果、可在影片上字幕。
                - text: 6.同一組別穿著顏色需相同(指定顏色為：橘色、黃色、藍色、黑色、白色或紅色其中一種)。
                - text: 7.參賽者須清楚露臉、至少完整上半身得以看清楚出左、右手彈奏姿勢。
                - text: 8.限定參賽者自選一首中文(本土語系)、英文或演奏曲目，改編曲及原創曲均可。
                - text: 9.聲音呈現，只能出現收錄當下參賽者本人歌聲、畫面中彈奏的木吉他聲。禁止人聲合音效果器、Loop錄音循環。
                - text: 10.限1~5人參賽，至少出現一把鋼弦木吉他。禁止對嘴代彈，如不符合以上規定將取消比賽資格。
                - text: 11.參賽影片須於評審期間維持公開狀態，如因刪除或隱藏導致無法評分，視同放棄資格。
                - text: 12.所有評斷Ayers主辦官方保有最終決策權。
                - paragraph [ref=e310]:
                  - strong [ref=e311]: Competition Rules
                - paragraph [ref=e312]: "1.Participants in the Instrumental Category must upload their video to ① YouTube (required) and ② either Instagram or Facebook, and title the video as “Song Title_Name_Instrumental Category #2026AyersSoulGuitaristCompetition”. The Instagram or Facebook post must also include the hashtag #2026AyersSoulGuitaristCompetition."
                - paragraph [ref=e313]: "2.Participants in the Singing & Playing Category must upload their video to ① YouTube (required) and ② either Instagram or Facebook, and title the video as “Song Title_Name_Singing & Playing Category #2026AyersSoulGuitaristCompetition”. The Instagram or Facebook post must also include the hashtag #2026AyersSoulGuitaristCompetition."
                - paragraph
                - paragraph
                - paragraph [ref=e314]:
                  - text: "3.Before performing in the video, participants must say:"
                  - text: “Hello everyone, I am (real name/stage name/band name). Today I am participating in the 2026 Ayers Soul Guitarist Competition, registering for the (Instrumental Category/Singing & Playing Category). My soul is (xx) guitar soul (⚠️ must match the color worn). (One sentence you would like to share with everyone.) The competition piece is (Song Title) by (Composer/Artist).”
                - paragraph [ref=e315]: 4.The total video duration must be between 30 seconds and 120 seconds.
                - paragraph [ref=e316]: 5.The recording must be in vertical format with a fixed camera and filmed in one continuous take. Editing, compositing, camera movement, or transition effects are prohibited. Subtitles may be added to the video.
                - paragraph [ref=e317]: "6.Participants within the same group must wear the same color (designated colors are: orange, yellow, blue, black, white, or red; choose one)."
                - paragraph [ref=e318]: 7.Participants must clearly show their face, and at least the full upper body must be visible so that both left and right hand playing positions can be clearly seen.
                - paragraph [ref=e319]: 8.Participants must select one piece in Chinese (local language), English, or instrumental. Arrangements and original compositions are both allowed.
                - paragraph [ref=e320]: 9.For audio presentation, only the participant’s live vocal (if applicable) and the acoustic guitar sound played in the video may be included. Vocal harmony effects and loop recording are prohibited.
                - paragraph [ref=e321]: 10.Each entry may have 1 to 5 participants, and at least one steel-string acoustic guitar must be present. Lip-syncing or ghost playing is prohibited. Failure to comply with the above rules will result in disqualification.
                - paragraph [ref=e322]: 11.Submitted videos must remain public during the judging period. If the video is deleted or made private and cannot be evaluated, it will be considered as forfeiting eligibility.
                - paragraph [ref=e323]: 12.All judging decisions are subject to the final determination of Ayers, the organizer.
              - generic "將這個問題設為必填" [ref=e324]: "*"
